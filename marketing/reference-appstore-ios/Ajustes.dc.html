<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --acao:#007AFF;--neutro-texto:#1C1C1E;--neutro-texto-sec:#6E6E73;--neutro-fundo:#F2F2F7;
    --neutro-superficie:#FFFFFF;--neutro-borda:#E5E5EA;--chevron:#C7C7CC;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  a{color:var(--acao);} a:hover{color:var(--acao);}
  .panel{
    width:1284px;height:2778px;position:relative;overflow:hidden;
    background:#EAF3FF;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  }
  .hero{padding:172px 90px 0;text-align:center;}
  .headline{font-size:92px;font-weight:800;line-height:1.08;letter-spacing:-1px;margin:0;color:var(--neutro-texto);}
  .subtitle{font-size:40px;font-weight:600;line-height:1.35;margin:26px 0 0;color:var(--neutro-texto-sec);}

  .phone-wrap{position:absolute;left:50%;top:648px;transform:translateX(-50%);width:1006px;height:2260px;}
  .bezel{width:100%;height:100%;background:#111214;border-radius:96px;padding:24px;box-shadow:0 40px 90px rgba(0,0,0,0.32);}
  .screen{width:100%;height:100%;background:var(--neutro-fundo);border-radius:76px;overflow:hidden;position:relative;}

  .statusbar{height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;font-size:32px;font-weight:600;color:var(--neutro-texto);}

  .ajustes-top{padding:20px 48px 0;}
  .back-row{display:flex;align-items:center;gap:10px;color:var(--acao);font-size:49px;font-weight:600;}
  .ajustes-title{font-size:82px;font-weight:800;color:var(--neutro-texto);margin-top:22px;}

  .section-header{padding:0 48px;margin-top:44px;margin-bottom:22px;font-size:41px;font-weight:600;color:var(--neutro-texto-sec);letter-spacing:0.5px;}

  .escala-row{padding:0 48px;display:flex;gap:26px;}
  .escala-card{flex:1;min-height:134px;border-radius:34px;background:var(--neutro-superficie);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px 0;}
  .escala-card.selected{border:5px solid var(--acao);}
  .escala-card .label{font-size:41px;font-weight:600;color:var(--neutro-texto);}
  .escala-card.selected .label{color:var(--acao);}
  .escala-card .example{font-size:53px;font-weight:600;color:var(--neutro-texto);}
  .escala-card.selected .example{color:var(--acao);}
  .escala-card .example.big{font-size:63px;}

  .group{margin:0 48px;background:var(--neutro-superficie);border-radius:34px;overflow:hidden;}
  .row{min-height:134px;display:flex;align-items:center;gap:28px;padding:0 38px;color:var(--acao);}
  .row.bordered{border-bottom:2px solid var(--neutro-borda);}
  .row .flex{flex:1;font-size:53px;font-weight:600;color:var(--neutro-texto);}

  .switch{width:108px;height:64px;border-radius:32px;background:var(--acao);position:relative;flex-shrink:0;}
  .switch .knob{position:absolute;top:5px;right:5px;width:54px;height:54px;border-radius:27px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);}
</style>
</helmet>

<div class="panel">
  <div class="hero">
    <p class="headline">Letra maior e<br>lista pra enviar</p>
    <p class="subtitle">Letra bem grande e uma lista pronta pra compartilhar.</p>
  </div>

  <div class="phone-wrap">
    <div class="bezel">
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <svg width="52" height="26" viewBox="0 0 52 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="1.5" width="41" height="23" rx="6"></rect>
            <rect x="5" y="5" width="34" height="16" rx="3" fill="currentColor" stroke="none"></rect>
            <line x1="46" y1="9" x2="46" y2="17"></line>
          </svg>
        </div>

        <div class="ajustes-top">
          <div class="back-row">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--acao)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Voltar</span>
          </div>
          <div class="ajustes-title">Ajustes</div>
        </div>

        <div class="section-header">TAMANHO DAS LETRAS</div>
        <div class="escala-row">
          <div class="escala-card selected">
            <span class="label">Grande</span>
            <span class="example">Losartana</span>
          </div>
          <div class="escala-card">
            <span class="label">Gigante</span>
            <span class="example big">Losartana</span>
          </div>
        </div>

        <div class="section-header">SOM DO AVISO</div>
        <div class="group">
          <div class="row">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--acao)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <span class="flex">Som do aviso</span>
            <div class="switch"><div class="knob"></div></div>
          </div>
        </div>

        <div class="section-header">REMÉDIOS</div>
        <div class="group">
          <div class="row bordered">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--acao)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line>
            </svg>
            <span class="flex">Remédios que parei</span>
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--chevron)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
          <div class="row">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--acao)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span class="flex">Compartilhar minha lista</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>
